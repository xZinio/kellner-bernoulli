name: Computations

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rerun what the proofs need and check every value stated in the paper (QUICK=1, about 3 minutes)
        run: QUICK=1 ./verify/run_all.sh
